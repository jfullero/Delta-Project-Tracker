<script>
    // --- Configuration Constants (Point to your API) ---
    const API_URL = 'http://localhost:3000/api'; // CHANGE THIS to your backend server address

    // Initial state setup
    let isAdmin = false;
    let currentDate = new Date();
    
    // Site location addresses mapping (can remain client-side or be fetched)
    const siteAddresses = {
        "Equinix-SV12": "11 Great Oaks Blvd, San Jose, CA 95119, United States",
        "Digital Crossroads": "250 N Illinois St, Indianapolis, IN 46204, United States",
        "Equinix-DC16": "21715 Filigree Ct, Ashburn, VA 20147, United States",
        "Equinix-NY11": "755 Secaucus Rd, Secaucus, NJ 07094, United States",
        "Equinix-NY3": "800 Secaucus Rd, Secaucus, NJ 07094, United States",
        "Equinix-NY4": "1 Teleport Dr, Staten Island, NY 10311, United States",
        "Equinix-SE4": "2601 Elliott Ave, Seattle, WA 98121, United States"
    };

    // DOM Elements
    const loginModal = document.getElementById('loginModal');
    const addUserModal = document.getElementById('addUserModal');
    const adminSection = document.getElementById('adminSection');
    const adminLink = document.getElementById('adminLink');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const addUserBtn = document.getElementById('addUserBtn');
    const generateReportBtn = document.getElementById('generateReportBtn');
    const closeModalButtons = document.querySelectorAll('.close-modal');
    const userListEl = document.getElementById('userList');
    const projectTableBody = document.getElementById('projectTable');
    const tabLinks = document.querySelectorAll('nav a[data-tab]');
    const tabSections = document.querySelectorAll('.dashboard');
    const prevMonthBtn = document.getElementById('prevMonth');
    const nextMonthBtn = document.getElementById('nextMonth');
    const currentMonthEl = document.getElementById('currentMonth');
    const calendarDays = document.getElementById('calendarDays');
    
    // Globals to hold fetched data
    let projects = [];
    let users = [];
    let reportChart; // For Chart.js instance

    // Set today's date as default
    document.getElementById('date').valueAsDate = new Date();
    
    // Set default address on page load and change
    document.getElementById('siteLocation').addEventListener('change', function() {
        const selectedSite = this.value;
        document.getElementById('siteAddress').value = siteAddresses[selectedSite] || '';
    });
    document.getElementById('siteAddress').value = siteAddresses["Equinix-SV12"];
    
    // --- API Functions for Project CRUD ---
    
    async function fetchProjects() {
        try {
            const response = await fetch(`${API_URL}/projects`);
            if (!response.ok) throw new Error('Failed to fetch projects');
            projects = await response.json();
            renderProjectTable();
            updateStats();
            renderCalendar();
            setupChart();
        } catch (error) {
            console.error('Error fetching projects:', error);
            projectTableBody.innerHTML = '<tr><td colspan="6">Failed to load projects. Check API connection.</td></tr>';
        }
    }
    
    async function addProject(projectData) {
        try {
            const response = await fetch(`${API_URL}/projects`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(projectData)
            });
            if (!response.ok) throw new Error('Failed to add project');
            
            alert('Project added successfully!');
            fetchProjects(); // Re-fetch to update table and stats
        } catch (error) {
            console.error('Error adding project:', error);
            alert('Failed to save project.');
        }
    }

    async function deleteProject(projectId) {
        if (!confirm('Are you sure you want to delete this project entry?')) return;

        try {
            const response = await fetch(`${API_URL}/projects/${projectId}`, {
                method: 'DELETE',
            });
            if (!response.ok) throw new Error('Failed to delete project');

            alert('Project deleted successfully!');
            fetchProjects(); // Re-fetch to update table and stats
        } catch (error) {
            console.error('Error deleting project:', error);
            alert('Failed to delete project.');
        }
    }
    
    // --- API Functions for User Management ---
    
    async function fetchUsers() {
        if (!isAdmin) return; // Only fetch if logged in as admin
        try {
            const response = await fetch(`${API_URL}/users`);
            if (!response.ok) throw new Error('Failed to fetch users');
            users = await response.json();
            renderUserList();
        } catch (error) {
            console.error('Error fetching users:', error);
            userListEl.innerHTML = '<p>Failed to load users.</p>';
        }
    }
    
    async function addNewUser(userData) {
        try {
            const response = await fetch(`${API_URL}/users`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            });
            if (!response.ok) throw new Error('Failed to add user');
            
            alert('User added successfully!');
            fetchUsers(); // Re-fetch to update list
        } catch (error) {
            console.error('Error adding user:', error);
            alert('Failed to add user.');
        }
    }

    // --- Rendering and UI Logic (mostly unchanged, now uses the 'projects' and 'users' globals) ---
    
    function renderProjectTable() {
        projectTableBody.innerHTML = '';
        projects.forEach(project => {
            const row = projectTableBody.insertRow();
            row.innerHTML = `
                <td>${project.siteLocation}</td>
                <td>${project.siteAddress.substring(0, 30)}...</td>
                <td>${project.manHours}</td>
                <td>${project.date}</td>
                <td><span class="admin-badge" style="background-color: 
                    ${project.status === 'completed' ? 'var(--success)' : 
                      project.status === 'active' ? 'var(--secondary)' : 'var(--warning)'};">
                    ${project.status.charAt(0).toUpperCase() + project.status.slice(1)}
                </span></td>
                <td class="actions">
                    <button class="action-btn delete" onclick="deleteProject(${project.id})">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            `;
        });
    }

    function updateStats() {
        const activeSites = [...new Set(projects.filter(p => p.status === 'active').map(p => p.siteLocation))];
        const totalManhours = projects.reduce((sum, p) => sum + parseFloat(p.manHours), 0);
        const completedProjects = projects.filter(p => p.status === 'completed').length;

        document.getElementById('activeSitesCount').textContent = activeSites.length;
        document.getElementById('totalManhours').textContent = totalManhours.toFixed(1);
        document.getElementById('completedProjects').textContent = completedProjects;
        // Budget calculation remains a placeholder for this example
    }

    function renderUserList() {
        userListEl.innerHTML = '';
        users.forEach(user => {
            const userItem = document.createElement('div');
            userItem.className = 'user-item';
            userItem.innerHTML = `
                <div class="user-info">
                    <div class="user-avatar">${user.name.split(' ').map(n => n[0]).join('').toUpperCase()}</div>
                    <span>${user.name}</span>
                    ${user.role === 'admin' ? '<span class="admin-badge">Admin</span>' : ''}
                </div>
                <div class="actions">
                    <button class="action-btn" disabled><i class="fas fa-edit"></i></button>
                    </div>
            `;
            userListEl.appendChild(userItem);
        });
    }
    
    // (Other UI functions like renderCalendar, setupChart, etc., are omitted for brevity,
    // but they would remain largely the same, operating on the 'projects' global array.)
    
    // --- Event Listener Setup ---

    function setupEventListeners() {
        // Project Form Submission
        document.getElementById('projectForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newProject = {
                siteLocation: document.getElementById('siteLocation').value,
                siteAddress: document.getElementById('siteAddress').value,
                manHours: parseFloat(document.getElementById('manHours').value),
                date: document.getElementById('date').value,
                notes: document.getElementById('projectNotes').value,
                status: document.getElementById('status').value,
            };
            
            addProject(newProject);
            this.reset();
            document.getElementById('date').valueAsDate = new Date(); // Reset date
            document.getElementById('siteAddress').value = siteAddresses["Equinix-SV12"]; // Reset address
        });

        // Admin functionality
        adminLink.addEventListener('click', function(e) {
            e.preventDefault();
            if (!isAdmin) {
                loginModal.style.display = 'flex';
            } else {
                adminSection.style.display = 'block';
                fetchUsers(); // Refresh user list when opening
            }
        });
        
        loginBtn.addEventListener('click', function() {
            const password = document.getElementById('adminPassword').value;
            // NOTE: In a real app, this should be an API call to verify credentials!
            if (password === 'delta2023') {
                isAdmin = true;
                loginModal.style.display = 'none';
                adminSection.style.display = 'block';
                document.getElementById('adminPassword').value = '';
                fetchUsers();
            } else {
                alert('Incorrect password. Please try again.');
            }
        });
        
        logoutBtn.addEventListener('click', function() {
            isAdmin = false;
            adminSection.style.display = 'none';
        });
        
        addUserBtn.addEventListener('click', function() {
            addUserModal.style.display = 'flex';
        });
        
        // Add User Form Submission
        document.getElementById('addUserForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userData = {
                name: document.getElementById('userName').value,
                email: document.getElementById('userEmail').value,
                role: document.getElementById('userRole').value,
                // NOTE: In a real app, you'd collect and securely hash a password here
                password: 'defaultpassword123' 
            };
            
            addNewUser(userData);
            this.reset();
            addUserModal.style.display = 'none';
        });
        
        // (Other event listeners like tab navigation, modal closing, calendar, reports, etc.)
        // ... (Calendar and Report logic here, referencing 'projects' array) ...
        
        // Placeholder for the rest of the original event listeners (e.g., tab navigation)
        tabLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const tabId = this.getAttribute('data-tab');
                tabLinks.forEach(l => l.classList.remove('active'));
                this.classList.add('active');
                tabSections.forEach(section => {
                    section.style.display = 'none';
                });
                document.getElementById(`${tabId}Tab`).style.display = 'block';
            });
        });
         
        // Close modals
        closeModalButtons.forEach(button => {
            button.addEventListener('click', function() {
                loginModal.style.display = 'none';
                addUserModal.style.display = 'none';
            });
        });

    } // end setupEventListeners

    // Initialize the application: Start fetching data from the MariaDB backend
    function init() {
        setupEventListeners();
        fetchProjects(); // Starts the whole process
    }
    
    init();
    
    // The calendar and report chart functions from the original script should be defined here
    // to complete the application, but they are omitted for conciseness.
</script>
